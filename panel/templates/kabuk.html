{% load static %}<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Geek Panel</title>
  <meta name="theme-color" content="#162AA3">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Geek Panel">
  <meta name="mobile-web-app-capable" content="yes">
  <script>try{if(localStorage.getItem('geek_tema')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <link rel="stylesheet" href="{% static 'css/kabuk.css' %}?v=1">
</head>
<body>
  <iframe id="uygulama" title="Geek Panel" data-src="{{ kabuk_url }}" allow="fullscreen; camera; microphone; geolocation; clipboard-write; autoplay"></iframe>
  <div id="radyo-kabuk" hidden></div>
  {{ radyo|json_script:"radyo-cfg" }}
  <script src="{% static 'js/geekradyo.js' %}?v=1"></script>
  <script src="{% static 'js/geekkabuk.js' %}?v=1"></script>
</body>
</html>
